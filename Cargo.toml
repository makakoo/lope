[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/traylinx/lope"
publish = false

# Shared versions follow makakoo-os/Cargo.toml where both projects use a crate
# (Spec 01 §3).
[workspace.dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"

lope-core = { path = "crates/lope-core" }
lope-state = { path = "crates/lope-state" }
lope-runtime = { path = "crates/lope-runtime" }
lope-providers = { path = "crates/lope-providers" }
lope-memory = { path = "crates/lope-memory" }
lope-makakoo = { path = "crates/lope-makakoo" }
lope-engine = { path = "crates/lope-engine" }
lope-flow = { path = "crates/lope-flow" }
lope-compat = { path = "crates/lope-compat" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
