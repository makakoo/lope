name: CI

on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version-and-format:
    name: version sync & rustfmt diff
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Version and manifest sync
        run: ./scripts/check-version.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # uses rust-toolchain.toml

      - name: Check formatting on changed Rust files
        run: |
          set -euo pipefail
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && \
               git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            base="${{ github.event.before }}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "::warning::No push before-SHA available; checking formatting against HEAD~1."
            base="HEAD~1"
          else
            echo "::warning::No base commit available; checking formatting of modified crate files only."
            rustfmt --edition 2021 --check crates/lope-cli/src/native/install.rs crates/lope-cli/tests/s8_cutover_parity.rs
            exit 0
          fi
          mapfile -t changed_rs < <(git diff --name-only --diff-filter=ACMRT "$base" HEAD -- '*.rs')
          if [ "${#changed_rs[@]}" -eq 0 ]; then
            echo "No changed .rs files relative to $base."
            exit 0
          fi
          rustfmt --edition 2021 --check "${changed_rs[@]}"

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # uses rust-toolchain.toml

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build workspace including examples/tests (locked)
        run: cargo build --workspace --all-targets --locked

      - name: Test workspace (locked, isolated LOPE_HOME)
        run: |
          set -euo pipefail
          lope_tmp="${{ runner.temp }}/lope-home"
          mkdir -p "$lope_tmp"
          LOPE_HOME="$lope_tmp" \
          LOPE_PYTHON_CHECKOUT="${{ github.workspace }}" \
            cargo test --workspace --locked

      - name: Clippy strict on warning-free crates & workspace check
        run: |
          set -euo pipefail
          cargo clippy --locked \
            -p lope-core -p lope-compat -p lope-state -p lope-runtime -p lope-providers \
            --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --locked

  parity-and-package:
    name: parity & packaged archive smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # uses rust-toolchain.toml

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Schema & CLI golden corpus parity
        run: |
          set -euo pipefail
          lope_tmp="${{ runner.temp }}/parity-lope-home"
          mkdir -p "$lope_tmp"
          export LOPE_HOME="$lope_tmp"
          export LOPE_PYTHON_CHECKOUT="${{ github.workspace }}"
          ./tools/parity/dump-python
          ./tools/parity/dump-rust
          ./tools/parity/diff
          cargo build --release --locked -p lope-cli
          for corpus in tools/parity/corpus/*.json; do
            echo "Running golden corpus: $corpus"
            /usr/bin/python3 -I tools/parity/golden_run.py \
              --lope target/release/lope \
              --lope-home "${{ github.workspace }}" \
              --corpus "$corpus"
          done

      - name: Packaged tarball & symlinked install smoke test
        run: |
          set -euo pipefail
          dist_dir="${{ runner.temp }}/pkg-dist"
          ./scripts/package-release.sh \
            --target x86_64-unknown-linux-gnu \
            --bin target/release/lope \
            --out-dir "$dist_dir"

          extract_dir="${{ runner.temp }}/extract space"
          prefix="${{ runner.temp }}/prefix with spaces"
          iso_home="${{ runner.temp }}/iso home"
          sym_dir="${{ runner.temp }}/sym bin"
          mkdir -p "$extract_dir" "$iso_home/.vibe" "$iso_home/.qwen" "$iso_home/.pi" "$sym_dir"

          ( cd "$dist_dir" && sha256sum -c lope-x86_64-unknown-linux-gnu.tar.gz.sha256 )
          tar -C "$extract_dir" -xzf "$dist_dir/lope-x86_64-unknown-linux-gnu.tar.gz"
          "$extract_dir/lope-x86_64-unknown-linux-gnu/install.sh" \
            --prefix "$prefix" --skip-install

          ln -s "$prefix/bin/lope" "$sym_dir/lope"
          (
            cd "${{ runner.temp }}"
            export HOME="$iso_home"
            export XDG_STATE_HOME="$iso_home/.local/state"
            export LOPE_HOME="$iso_home/.lope"
            export PATH="$sym_dir:/usr/bin:/bin"
            unset LOPE_SOURCE_DIR LOPE_DOCS_PATH LOPE_BIN
            "$sym_dir/lope" --version
            "$sym_dir/lope" docs >/dev/null
            "$sym_dir/lope" install --host all
            test -f "$iso_home/.codex/skills/lope/SKILL.md"
            test -L "$iso_home/.claude/skills/lope"
            test -L "$iso_home/.gemini/commands/lope/ask.toml"
            test -L "$iso_home/.config/opencode/commands/lope.md"
            test -L "$iso_home/.cursor/agents/lope.md"
            test -L "$iso_home/.vibe/skills/lope"
            test -L "$iso_home/.qwen/skills/lope"
            test -L "$iso_home/.agents/skills/lope"
          )

          # Empty/relative prefix must fail cleanly; orphaned binary must fail cleanly.
          if "$extract_dir/lope-x86_64-unknown-linux-gnu/install.sh" --prefix= --skip-install; then
            echo "ERROR: expected empty --prefix to fail" >&2
            exit 1
          fi
          orphan="${{ runner.temp }}/orphan"
          mkdir -p "$orphan/bin"
          cp "$prefix/bin/lope" "$orphan/bin/lope"
          if ( cd "${{ runner.temp }}" && HOME="$iso_home" LOPE_HOME="$iso_home/.lope" "$orphan/bin/lope" install --host codex ); then
            echo "ERROR: expected orphaned binary without share/lope to fail" >&2
            exit 1
          fi

  python:
    name: python compat (${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint & test deps
        run: python -m pip install --upgrade pip ruff pytest pytest-asyncio

      - name: Lint shipping Python package, tests, and packaging script
        run: ruff check lope tests scripts/check-package.py

      - name: Syntax check
        run: python -m compileall -q lope tests scripts

      - name: Run Python test suite
        run: |
          mkdir -p "${{ runner.temp }}/py-lope-home"
          LOPE_HOME="${{ runner.temp }}/py-lope-home" python -m pytest -q

      - name: Build & verify legacy compat wheel/sdist
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build twine
          out="${{ runner.temp }}/wheel-dist"
          python -m build --outdir "$out"
          python -m twine check "$out/"*
          python scripts/check-package.py "$out/"lope_agent-*.whl --sdist "$out/"lope_agent-*.tar.gz

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install gitleaks (checksum-verified, user-temp bindir)
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$asset" "${base}/${asset}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v f="$asset" '$2 == f' checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          bin_dir="${{ runner.temp }}/gitleaks-bin"
          mkdir -p "$bin_dir"
          install -m 0755 gitleaks "$bin_dir/gitleaks"
          echo "$bin_dir" >> "$GITHUB_PATH"
          rm -f "$asset" checksums.txt gitleaks

      - name: Run gitleaks
        run: |
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1
