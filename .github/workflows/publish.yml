name: Release

# Tag-driven binary release pipeline for makakoo/lope (POSIX targets only).
# Builds `lope` release tarballs for macOS (arm64, x86_64) and Linux
# (x86_64, arm64; GNU tarballs target glibc >= 2.35 / ubuntu-22.04+), verifies
# archive integrity + binary execution, gates publication on full CI checks,
# generates SHA256SUMS + Sigstore build provenance, and publishes a GitHub
# Release on `v*` tags.
#
# Note: The legacy Python compatibility package (`lope-agent` in pyproject.toml)
# stays frozen at compat version `0.17.3` for rollback (`lope-py`) and golden
# parity testing; v2.* tags publish native Rust binary releases only.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify release metadata & tag
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pin matches rust-toolchain.toml
        with:
          toolchain: '1.96.1'

      - name: Verify product & compat version sync
        run: ./scripts/check-version.sh

      - name: Verify strict SemVer tag matches Cargo workspace product version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          pre_id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver_re="^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-${pre_id}(\\.${pre_id})*)?\$"
          if ! echo "$tag" | grep -Eq "$semver_re"; then
            echo "ERROR: tag '$tag' must match strict SemVer vX.Y.Z[-prerelease] (no leading zeros or build metadata)" >&2
            exit 1
          fi
          cargo_ver="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lope-cli") | .version')"
          expected="v${cargo_ver}"
          if [ "$tag" != "$expected" ]; then
            echo "ERROR: tag '$tag' does not match lope-cli Cargo version '$expected'" >&2
            exit 1
          fi
          echo "Verified tag $tag matches lope-cli version $cargo_ver"

  ci:
    name: release CI gate
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            smoke: native
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
            smoke: inspect
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: false
            smoke: native
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
            smoke: qemu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain & target
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pin matches rust-toolchain.toml
        with:
          toolchain: '1.96.1'
          targets: ${{ matrix.target }}

      - name: Install cross linker & QEMU (Linux aarch64)
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary (locked)
        run: cargo build --release --locked -p lope-cli --target ${{ matrix.target }}

      - name: Inspect binary linkage & architecture
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/lope"
          file "$bin"
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            if [ "${{ matrix.cross }}" = "true" ]; then
              aarch64-linux-gnu-readelf -d "$bin" | head -n 30
            else
              ldd "$bin"
            fi
          else
            otool -L "$bin"
          fi

      - name: Package deterministic release tarball & checksum
        run: |
          mkdir -p dist
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
          ./scripts/package-release.sh \
            --target "${{ matrix.target }}" \
            --bin "target/${{ matrix.target }}/release/lope" \
            --out-dir dist

      - name: Smoke test release bundle (native)
        if: matrix.smoke == 'native'
        run: |
          set -euo pipefail
          stage="${{ runner.temp }}/release-smoke"
          prefix="${{ runner.temp }}/prefix"
          home="${{ runner.temp }}/home"
          mkdir -p "$stage" "$home"
          tar -C "$stage" -xzf "dist/lope-${{ matrix.target }}.tar.gz"
          HOME="$home" LOPE_HOME="$home/.lope" LOPE_SOURCE_DIR="" \
            "$stage/lope-${{ matrix.target }}/install.sh" --prefix "$prefix" --host codex
          HOME="$home" LOPE_HOME="$home/.lope" "$prefix/bin/lope" --version
          HOME="$home" LOPE_HOME="$home/.lope" "$prefix/bin/lope" docs >/dev/null
          test -f "$home/.codex/skills/lope/SKILL.md"

      - name: Smoke test binary under Rosetta when available (macOS x86_64)
        if: matrix.smoke == 'inspect'
        run: |
          set -euo pipefail
          if /usr/bin/arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            stage="${{ runner.temp }}/release-smoke-x64"
            prefix="${{ runner.temp }}/prefix-x64"
            home="${{ runner.temp }}/home-x64"
            mkdir -p "$stage" "$home"
            tar -C "$stage" -xzf "dist/lope-${{ matrix.target }}.tar.gz"
            HOME="$home" LOPE_HOME="$home/.lope" \
              /usr/bin/arch -x86_64 "$stage/lope-${{ matrix.target }}/install.sh" --prefix "$prefix" --host codex
            /usr/bin/arch -x86_64 "$prefix/bin/lope" --version
            HOME="$home" LOPE_HOME="$home/.lope" /usr/bin/arch -x86_64 "$prefix/bin/lope" docs >/dev/null
            test -f "$home/.codex/skills/lope/SKILL.md"
          else
            echo "::notice::Rosetta 2 unavailable on runner; verified Mach-O x86_64 binary via file and otool -L."
          fi

      - name: Smoke test binary under QEMU (Linux aarch64)
        if: matrix.smoke == 'qemu'
        run: |
          set -euo pipefail
          stage="${{ runner.temp }}/release-smoke-aarch64"
          mkdir -p "$stage"
          tar -C "$stage" -xzf "dist/lope-${{ matrix.target }}.tar.gz"
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$stage/lope-${{ matrix.target }}/bin/lope" --version

      - name: Upload target archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lope-${{ matrix.target }}
          path: |
            dist/lope-${{ matrix.target }}.tar.gz
            dist/lope-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub Release
    needs: [verify, ci, build]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: Verify sidecars & assemble SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release-files
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            if [ -e "release-files/$base" ]; then
              echo "ERROR: duplicate release asset filename '$base'" >&2
              exit 1
            fi
            cp "$f" "release-files/$base"
          done < <(find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -print0)
          (
            cd release-files
            for sumfile in ./*.sha256; do
              sha256sum -c "$sumfile"
            done
            cat ./*.sha256 | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          ls -la release-files/

      - name: Generate Sigstore build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release-files/*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
